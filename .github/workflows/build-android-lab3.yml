name: Meti LAB 3 all algorithms APK
on:
  push:
    branches: [feat/lab3-auto]
    paths: ['android-lab3/**', 'tools/lab3/**', '.github/workflows/build-android-lab3.yml']
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: meti-lab3-${{ github.ref }}
  cancel-in-progress: true
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'
      - name: Unit tests
        run: gradle -p android-lab3 --no-daemon testDebugUnitTest
      - name: Prepare verified trained model
        run: |
          python -m pip install torch==2.6.0 --index-url https://download.pytorch.org/whl/cpu
          python -m pip install onnx==1.17.0 onnxruntime==1.20.1 numpy protobuf==5.29.5
          git clone https://github.com/IDKiro/DehazeFormer.git /tmp/lab3-model-source
          git -C /tmp/lab3-model-source checkout 5af7c34d6f8e0784a88a2132a7add296bf99ca9c
          python - <<'PY'
          import urllib.request
          url='https://drive.google.com/uc?export=download&id=1bjSzDGGCjdFB-ixEDPDMm8bmke1PBtkp'
          urllib.request.urlretrieve(url,'/tmp/dehazeformer-t-outdoor.pth')
          PY
          python tools/lab3/export_model.py /tmp/lab3-model-source /tmp/dehazeformer-t-outdoor.pth android-lab3/app/src/main/assets/dehazeformer-t-outdoor-256.onnx
      - name: Build tablet APK
        run: gradle -p android-lab3 --no-daemon assembleDebug
      - name: Verify package, assets and signature
        run: |
          set -euo pipefail
          apk=android-lab3/app/build/outputs/apk/debug/app-debug.apk
          sdk="${ANDROID_SDK_ROOT:-$ANDROID_HOME}"
          tool=$(find "$sdk/build-tools" -name aapt -type f | sort -V | tail -1)
          signer="$(dirname "$tool")/apksigner"
          "$tool" dump badging "$apk" > /tmp/lab3-package.txt
          grep "name='ua.meti.tuman.lab3'" /tmp/lab3-package.txt
          if "$tool" dump permissions "$apk" | grep -q android.permission.INTERNET; then exit 1; fi
          "$signer" verify --verbose "$apk"
          python - <<'PY'
          import zipfile,json,hashlib
          with zipfile.ZipFile('android-lab3/app/build/outputs/apk/debug/app-debug.apk') as z:
              assert z.testzip() is None
              model=z.read('assets/dehazeformer-t-outdoor-256.onnx')
              meta=json.loads(z.read('assets/dehazeformer-t-outdoor-256.json'))
              assert hashlib.sha256(model).hexdigest()==meta['onnx_sha256']
              assert max(meta['parity_max_abs_errors'])<meta['parity_limit']
              assert 'lib/arm64-v8a/libonnxruntime.so' in z.namelist()
          PY
          mkdir -p lab3-delivery
          cp "$apk" lab3-delivery/Meti-Tuman-LAB3-ALL-MODES.apk
          cp android-lab3/app/src/main/assets/dehazeformer-t-outdoor-256.json lab3-delivery/model-provenance.json
          cp docs/LAB3-QUICKSTART.md lab3-delivery/
          sha256sum lab3-delivery/Meti-Tuman-LAB3-ALL-MODES.apk > lab3-delivery/SHA256.txt
      - uses: actions/upload-artifact@v4
        with:
          name: Meti-Tuman-LAB3-ALL-MODES
          path: lab3-delivery/
          retention-days: 90
      - name: Enable KVM for emulator
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 29
          arch: x86_64
          profile: pixel_2
          disable-animations: true
          script: gradle -p android-lab3 -PlabTestAbi=x86_64 --no-daemon connectedDebugAndroidTest
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: LAB3-test-reports
          path: |
            android-lab3/app/build/reports/
            android-lab3/app/build/outputs/androidTest-results/
