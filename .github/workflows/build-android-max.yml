# Digital Dehazing Adaptive Object MAX v2
name: Build Digital Dehazing / Меті Туман Adaptive Object MAX
on:
  push:
    branches: [main]
    paths:
      - 'android-max/**'
      - '.github/workflows/build-android-max.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: digital-dehazing-adaptive-object-max-apk
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Configure Android SDK
        run: |
          set -euo pipefail
          sdk="${ANDROID_SDK_ROOT:-${ANDROID_HOME:-/usr/local/lib/android/sdk}}"
          echo "ANDROID_HOME=$sdk" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=$sdk" >> "$GITHUB_ENV"
          tool="$sdk/cmdline-tools/latest/bin/sdkmanager"
          test -x "$tool"
          yes | "$tool" --licenses >/dev/null 2>&1 || true
          "$tool" 'platforms;android-35' 'build-tools;35.0.0' 'platform-tools'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'
      - name: Compile independent Adaptive Object MAX APK
        id: compile
        run: gradle -p android-max --no-daemon --stacktrace assembleDebug
      - name: Verify unique Adaptive Object MAX package and APK
        id: verify
        run: |
          set -euo pipefail
          apk=android-max/app/build/outputs/apk/debug/app-debug.apk
          test -s "$apk"
          "${ANDROID_HOME}/build-tools/35.0.0/aapt" dump badging "$apk" | grep '^package:' | tee package.txt
          grep "name='ua.digitaldehazing.metituman.adaptiveobjectmax'" package.txt
          cp "$apk" Digital-Dehazing-Meti-Tuman-Adaptive-Object-MAX.apk
          sha256sum Digital-Dehazing-Meti-Tuman-Adaptive-Object-MAX.apk > Digital-Dehazing-Meti-Tuman-Adaptive-Object-MAX.apk.sha256
          ls -lh Digital-Dehazing-Meti-Tuman-Adaptive-Object-MAX.apk
      - name: Upload Digital Dehazing MAX APK
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: Digital-Dehazing-Adaptive-Object-MAX-debug
          path: |
            Digital-Dehazing-Meti-Tuman-Adaptive-Object-MAX.apk
            Digital-Dehazing-Meti-Tuman-Adaptive-Object-MAX.apk.sha256
          if-no-files-found: error
          retention-days: 90
      - name: Publish separate Digital Dehazing Adaptive Object MAX release
        id: publish
        if: success()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          tag=digital-dehazing-adaptive-object-max-v2
          if ! gh release view "$tag" >/dev/null 2>&1; then
            gh release create "$tag" --title "Digital Dehazing / Меті Туман Adaptive Object MAX v2 — окрема APK" --notes "Independent Android package ua.digitaldehazing.metituman.adaptiveobjectmax. Adaptive Object Dehaze uses real image structure only: DCP, transmission recovery, atmospheric light, edge-guided refinement, local contrast, detail recovery, adaptive denoise and temporally stabilized AUTO parameters. Installs alongside all previous Меті Туман / Digital Dehazing APKs." --prerelease
          fi
          gh release upload "$tag" Digital-Dehazing-Meti-Tuman-Adaptive-Object-MAX.apk Digital-Dehazing-Meti-Tuman-Adaptive-Object-MAX.apk.sha256 --clobber
          gh release view "$tag" --json url,assets
      - name: Record Adaptive MAX build status
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
          COMPILE: ${{ steps.compile.outcome }}
          VERIFY: ${{ steps.verify.outcome }}
          PUBLISH: ${{ steps.publish.outcome }}
        run: |
          set -euo pipefail
          if [ "$COMPILE" = success ] && [ "$VERIFY" = success ] && [ "$PUBLISH" = success ]; then
            state=success
          else
            state=failure
          fi
          jq -nc \
            --arg state "$state" \
            --arg compile "$COMPILE" \
            --arg verify "$VERIFY" \
            --arg publish "$PUBLISH" \
            --arg commit "$GITHUB_SHA" \
            --arg url "$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID" \
            --arg apk "$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/releases/download/digital-dehazing-adaptive-object-max-v2/Digital-Dehazing-Meti-Tuman-Adaptive-Object-MAX.apk" \
            --arg time "$(date -u +%FT%TZ)" \
            '{state:$state,compile:$compile,verify:$verify,publish:$publish,commit:$commit,workflow_url:$url,apk_url:(if $state=="success" then $apk else null end),updated_utc:$time}' > digital-dehazing-adaptive-object-max-build-status.json
          old_sha=$(gh api "repos/$GITHUB_REPOSITORY/contents/digital-dehazing-adaptive-object-max-build-status.json" --jq .sha 2>/dev/null || true)
          if [ -n "$old_sha" ]; then
            gh api -X PUT "repos/$GITHUB_REPOSITORY/contents/digital-dehazing-adaptive-object-max-build-status.json" \
              -f message="Record Digital Dehazing Adaptive Object MAX APK build" \
              -f content="$(base64 -w0 < digital-dehazing-adaptive-object-max-build-status.json)" \
              -f sha="$old_sha" -f branch=main >/dev/null
          else
            gh api -X PUT "repos/$GITHUB_REPOSITORY/contents/digital-dehazing-adaptive-object-max-build-status.json" \
              -f message="Record independent Adaptive MAX APK build" \
              -f content="$(base64 -w0 < digital-dehazing-adaptive-object-max-build-status.json)" \
              -f branch=main >/dev/null
          fi
