plugins { id 'com.android.application' }
android {
    namespace 'ua.dehaze.live'
    compileSdk 35
    defaultConfig {
        // Distinct from the installed original ua.meti.tuman.
        applicationId 'ua.meti.digitaldehazing.videotest'
        minSdk 26
        targetSdk 35
        versionCode 4
        versionName '1.0.3-night-auto'
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
    // Includes bundled photo algorithms; no network dependency.
    androidResources { noCompress 'html', 'js' }
}

dependencies {
    testImplementation 'junit:junit:4.13.2'
}

