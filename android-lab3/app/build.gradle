plugins { id 'com.android.application' }
android {
    namespace 'ua.dehaze.live'
    compileSdk 35
    defaultConfig {
        // Distinct from the installed original ua.meti.tuman.
        applicationId 'ua.meti.tuman.lab3.auto'
        minSdk 26
        targetSdk 35
        versionCode 1
        versionName '3.1.0-auto'
        ndk { abiFilters project.findProperty('labTestAbi') ?: 'arm64-v8a' }
        testInstrumentationRunner 'androidx.test.runner.AndroidJUnitRunner'
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
    testOptions { unitTests.returnDefaultValues = true }
    // Includes bundled photo algorithms; no network dependency.
    androidResources { noCompress 'html', 'js', 'onnx' }
}

dependencies {
    implementation 'com.microsoft.onnxruntime:onnxruntime-android:1.23.2'
    testImplementation 'junit:junit:4.13.2'
    androidTestImplementation 'androidx.test.ext:junit:1.2.1'
    androidTestImplementation 'androidx.test:core:1.6.1'
    androidTestImplementation 'androidx.test:runner:1.6.2'
}
