plugins { id 'com.android.application' }
// Build trigger: 2.2.3 camera + Adaptive5
// merge-trigger 2.2.4
android {
    namespace 'ua.dehaze.live'
    compileSdk 35
    defaultConfig {
        // Distinct from the installed original ua.meti.tuman.
        applicationId 'ua.digitaldehazing.metituman.adaptiveobjectmax'
        minSdk 26
        targetSdk 35
        versionCode 9
        versionName '2.2.4'
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
    // Includes bundled photo algorithms; no network dependency.
    androidResources { noCompress 'html', 'js' }
}
